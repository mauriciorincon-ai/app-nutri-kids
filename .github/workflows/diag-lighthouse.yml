# TEMPORAL (S10 · PR #17): desglose de Lighthouse en el mismo runner que el gate, para saber qué
# ocupa el hilo principal de Hoy. Se borra antes del merge.
name: diag-lighthouse
on: pull_request
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse ×5 en / y ×2 en /dieta, con desglose
        run: |
          npm i -g lighthouse@12
          (pnpm start > /dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3600/ && break; sleep 1; done
          mkdir -p lh
          for n in 1 2 3 4 5; do lighthouse http://127.0.0.1:3600/ --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance --output=json --output-path=lh/home-$n.json || true; done
          for n in 1 2; do lighthouse http://127.0.0.1:3600/dieta --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance --output=json --output-path=lh/dieta-$n.json || true; done
          node scripts/diag-lighthouse.cjs lh
