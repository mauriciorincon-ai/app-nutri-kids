# TEMPORAL (S15): mide el TBT y el peso de script de las 20 rutas en el runner, main contra la rama en el mismo trabajo (mediana de 10). Se borra antes del PR.
name: tbt-s15
on:
  push:
    branches: [sprint-015/lo-que-aprende]
jobs:
  tbt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [a, b]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: main fuera del árbol de la rama (el tsc de la rama no debe verlo)
        run: mkdir -p "$RUNNER_TEMP/base" && git archive origin/main | tar -x -C "$RUNNER_TEMP/base"
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: ${{ runner.temp }}/base
      - run: npm i -g @lhci/cli
      - name: Rutas de esta mitad
        run: |
          if [ "${{ matrix.part }}" = "a" ]; then jq -r '.urls[0:10][]' lighthouse-urls.json > "$RUNNER_TEMP/urls.txt"; else jq -r '.urls[10:][]' lighthouse-urls.json > "$RUNNER_TEMP/urls.txt"; fi
          cat "$RUNNER_TEMP/urls.txt"
      - name: main contra la rama, alternando (2 x 5 corridas cada uno)
        run: |
          measure() { # $1 = nombre, $2 = directorio
            args=()
            while read -r u; do
              # /aprende no existe en main
              if [ "$1" = "main" ] && [ "$u" = "http://127.0.0.1:3600/aprende" ]; then continue; fi
              args+=("--collect.url=$u")
            done < "$RUNNER_TEMP/urls.txt"
            (cd "$2" && rm -rf .lighthouseci && lhci collect --startServerCommand="pnpm exec next start -H 127.0.0.1 -p 3600" --numberOfRuns=5 "${args[@]}" >/dev/null 2>&1 || true
             for f in .lighthouseci/lhr-*.json; do node -e 'const j=require(process.argv[1]);const s=j.audits["resource-summary"].details.items.find(i=>i.resourceType==="script").transferSize;console.log(process.argv[2],new URL(j.finalUrl).pathname,Math.round(j.audits["total-blocking-time"].numericValue),Math.round(s/1024*10)/10)' "$PWD/$f" "$1"; done) | tee -a "$RUNNER_TEMP/tbt.txt"
          }
          measure main "$RUNNER_TEMP/base"
          measure rama .
          measure main "$RUNNER_TEMP/base"
          measure rama .
      - name: Medianas por ruta
        run: |
          node -e '
          const l=require("fs").readFileSync(process.argv[1],"utf8").trim().split("\n").map(x=>x.split(" "));
          const med=v=>{v=v.slice().sort((a,b)=>a-b);const n=v.length;return n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2};
          const routes=[...new Set(l.map(x=>x[1]))];
          console.log("ruta | TBT main | TBT rama | n main/rama | script KB main | script KB rama");
          for(const r of routes){
            const m=l.filter(x=>x[0]==="main"&&x[1]===r), b=l.filter(x=>x[0]==="rama"&&x[1]===r);
            console.log(r,"|",m.length?med(m.map(x=>+x[2])):"n/a","|",med(b.map(x=>+x[2])),"|",m.length+"/"+b.length,"|",m.length?med(m.map(x=>+x[3])):"n/a","|",med(b.map(x=>+x[3])));
          }' "$RUNNER_TEMP/tbt.txt" | tee -a "$GITHUB_STEP_SUMMARY"
