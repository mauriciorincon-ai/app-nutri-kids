# TEMPORAL (S11): mide el TBT de Hoy en el runner antes de abrir el PR. Se borra antes del PR.
name: tbt-s11
on:
  push:
    branches: [sprint-011/dia-a-dia]
jobs:
  tbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse sobre Hoy y las tres pantallas nuevas, 3 corridas cada una
        run: |
          npm i -g @lhci/cli
          lhci autorun --collect.startServerCommand="pnpm start" --collect.url=http://127.0.0.1:3600/ --collect.url=http://127.0.0.1:3600/lonchera --collect.url=http://127.0.0.1:3600/recetas --collect.url=http://127.0.0.1:3600/viaje --collect.numberOfRuns=3 --assert.budgetsFile=./perf-budget.json || true
          cat > /tmp/sum.cjs <<'JS'
          const j=require(process.argv[2]); const r=j.audits;
          console.log("==", j.finalUrl.replace("http://127.0.0.1:3600",""), "TBT", Math.round(r["total-blocking-time"].numericValue), "TTI", Math.round(r["interactive"].numericValue), "FCP", Math.round(r["first-contentful-paint"].numericValue));
          console.log("  main-thread:", r["mainthread-work-breakdown"].details.items.map(i=>i.groupLabel+" "+Math.round(i.duration)).join(" · "));
          for (const i of r["bootup-time"].details.items.slice(0,5)) console.log("  boot", Math.round(i.total), "ms ·", Math.round(i.scripting), "script ·", i.url.replace(/^.*\/_next\//,""));
          const lt=r["long-tasks"]; if(lt&&lt.details) for (const i of lt.details.items.slice(0,6)) console.log("  long", Math.round(i.duration),"ms @", Math.round(i.startTime), i.url.replace(/^.*\/_next\//,""));
          JS
          for f in .lighthouseci/lhr-*.json; do node /tmp/sum.cjs "$PWD/$f"; done
