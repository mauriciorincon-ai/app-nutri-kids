allowBuilds:
  sharp: true
  unrs-resolver: true
  '@swc/core': true
  esbuild: true
  '@tailwindcss/oxide': true
  '@sentry/cli': true
# Parche de seguridad de next (decisión «1a» del 2026-11-01): 16.4.4 se publicó el
# 2026-11-02, el mismo día en que se aplicó, y pnpm 11 rechaza versiones más nuevas que
# su `minimumReleaseAge`. Se exime SOLO la versión exacta, tras verificar su provenance
# SLSA (workflow build_and_deploy.yml de vercel/next.js en el tag v16.4.4). Pasada la
# ventana, la exención sobra y se retira.
minimumReleaseAgeExclude:
  - '@next/env@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - next@16.4.4
  - '@next/eslint-plugin-next@16.4.4'
  - eslint-config-next@16.4.4
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@swc/core'
  - esbuild
  - '@tailwindcss/oxide'
  - '@sentry/cli'
# Parche de seguridad: brace-expansion <1.1.16 tiene un ReDoS (GHSA-3jxr-9vmj-r5cp).
# Solo entra transitivamente por la cadena de eslint (devDependency); ningún dep
# NUEVO — se fija el patch parcheado para que el gate `pnpm audit --high` quede
# limpio. Aviso surgido tras el S3 (advisory posterior al audit verde del sprint).
# Parches de seguridad de dependencias TRANSITIVAS. Ninguno entra por una dependencia
# directa nuestra; todos son advisories publicados después del cierre del sprint 003 y
# el gate `pnpm audit --audit-level high` gatea el merge. Se fija en cada caso la
# versión parcheada DENTRO de la misma línea mayor, para no arrastrar cambios de API.
# Se revisan al abrir cada PR: cuando el upstream publique la versión buena, el
# override sobra y se retira.
overrides:
  # DoS por expansión sin límite + ReDoS (GHSA-3jxr-9vmj-r5cp y sucesores). Llega por
  # la cadena de eslint (minimatch) y por globby.
  brace-expansion@<1.1.18: '^1.1.18'
  brace-expansion@>=4.0.0 <5.0.9: '^5.0.9'
  # Divulgación de información entre usuarios (cliente HTTP de Node, vía el SDK de IA).
  undici@<7.29.0: '^7.29.0'
  # Confusión de host en URIs (llega por ajv, desde shadcn y webpack).
  fast-uri@<3.1.4: '^3.1.4'
  # Vulnerabilidades heredadas de libvips; la devDependency directa ya es ^0.35.3.
  sharp@<0.35.0: '^0.35.3'
  # Lectura arbitraria de archivos: era la deuda «moderate» declarada en el S3, el
  # advisory subió a high y deja de ser diferible.
  postcss@<8.5.18: '^8.5.18'
  ip-address@<10.3.1: '^10.3.1'
  js-yaml@>=4.0.0 <4.3.1: '^4.3.1'
  nanoid@<3.3.18: '^3.3.18'
